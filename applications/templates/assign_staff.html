{% extends "base.html" %}

{% block title %}
Assign Staff
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h3 class="mb-0">
                        Assign Staff
                    </h3>

                </div>

                <div class="card-body">

                    <p class="mb-4">

                        Assign a staff member for the trek:

                        <strong>{{ trek.name }}</strong>

                    </p>

                    <form method="POST">

                        <div class="mb-4">

                            <label class="form-label">
                                Select Staff Member
                            </label>

                            <select
                                name="staff_id"
                                class="form-select"
                                required>

                                {% for staff in staff_members %}

                                <option value="{{ staff.id }}">

                                    {{ staff.username }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('dashboard.manage_treks') }}"
                               class="btn btn-secondary">

                                Cancel

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                Assign Staff

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
