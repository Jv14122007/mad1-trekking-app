{% extends "base.html" %}
{% block title %}Login | WannaTrek{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-5 col-md-7">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-success text-white text-center py-4">
                <i class="bi bi-tree-fill fs-2 d-block mb-2"></i>
                <h3 class="mb-0 fw-bold">Welcome Back</h3>
                <p class="mb-0 small">Sign in to your WannaTrek account</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope-fill text-success"></i></span>
                            <input type="email" name="email" class="form-control"
                                   placeholder="you@example.com"
                                   value="{{ request.form.get('email','') }}" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill text-success"></i></span>
                            <input type="password" name="password" class="form-control"
                                   placeholder="Enter your password" required>
                        </div>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </button>
                    </div>
                </form>
                <hr>
                <p class="text-center mb-1">
                    Don't have an account?
                    <a href="{{ url_for('auth.register') }}" class="text-success fw-bold text-decoration-none">Register here</a>
                </p>
                <p class="text-center mb-0">
                    <a href="{{ url_for('home') }}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Back to Home
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
