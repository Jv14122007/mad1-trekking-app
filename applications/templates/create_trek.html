{% extends "base.html" %}

{% block title %}
Create Trek
{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card shadow border-0">

            <!-- Header -->
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">
                    Create New Trek
                </h4>
            </div>

            <!-- Body -->
            <div class="card-body">

                <form method="POST">

                    <!-- Trek Name -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Trek Name
                        </label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter trek name"
                            required>
                    </div>

                    <!-- Location -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Location
                        </label>
                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            placeholder="Enter trek location"
                            required>
                    </div>

                    <!-- Difficulty -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Difficulty
                        </label>
                        <select
                            name="difficulty"
                            class="form-select"
                            required>
                            <option value="" disabled selected>
                                -- Select Difficulty --
                            </option>
                            <option value="Easy">Easy</option>
                            <option value="Moderate">Moderate</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>


                    <!-- Dates -->
                    <div class="row">

    <div class="col-md-6 mb-3">
        <label class="form-label">
            Start Date
        </label>

        <input
            type="date"
            name="start_date"
            class="form-control"
            required>
    </div>


    <div class="col-md-6 mb-3">
        <label class="form-label">
            End Date
        </label>

        <input
            type="date"
            name="end_date"
            class="form-control"
            required>
    </div>

</div>

                    <!-- Slots -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            Available Slots
                        </label>
                        <input
                            type="number"
                            name="slots"
                            min="1"
                            class="form-control"
                            placeholder="Enter available slots"
                            required>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-between">

                        <a href="{{ url_for('dashboard.manage_treks') }}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-success">
                            Create Trek
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


</div>

{% endblock %}
