{% extends "base.html" %}

{% block title %}
Create Trek
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h3 class="mb-0">
                        Create New Trek
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Trek Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter trek name"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                class="form-control"
                                placeholder="Enter location"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Difficulty
                            </label>

                            <select
                                name="difficulty"
                                class="form-select">

                                <option>Easy</option>
                                <option>Moderate</option>
                                <option>Difficult</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Trek Date
                            </label>

                            <input
                                type="date"
                                name="date"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Available Slots
                            </label>

                            <input
                                type="number"
                                name="slots"
                                min="1"
                                class="form-control"
                                placeholder="Enter number of slots"
                                required>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('dashboard.manage_treks') }}"
                               class="btn btn-secondary">

                                Cancel

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                Create Trek

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
