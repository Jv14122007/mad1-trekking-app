<!DOCTYPE html>
<html>
<head>
    <title>Edit Trek</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>Edit Trek</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Trek Name</label>
            <input
                type="text"
                class="form-control"
                name="name"
                value="{{ trek.name }}"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <input
                type="text"
                class="form-control"
                name="location"
                value="{{ trek.location }}"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Difficulty</label>

            <select class="form-control" name="difficulty">

                <option {% if trek.difficulty=="Easy" %}selected{% endif %}>Easy</option>

                <option {% if trek.difficulty=="Moderate" %}selected{% endif %}>Moderate</option>

                <option {% if trek.difficulty=="Hard" %}selected{% endif %}>Hard</option>

            </select>

        </div>

        <div class="mb-3">
            <label class="form-label">Date</label>

            <input
                type="date"
                class="form-control"
                name="date"
                value="{{ trek.date }}"
                required>

        </div>

        <div class="mb-3">
            <label class="form-label">Slots</label>

            <input
                type="number"
                class="form-control"
                name="slots"
                value="{{ trek.slots }}"
                required>

        </div>

        <button class="btn btn-success">
            Update Trek
        </button>

        <a href="{{ url_for('dashboard.manage_treks') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
