{% extends "base.html" %}

{% block title %}
Edit Trek
{% endblock %}


{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">


<div class="card shadow border-0">


<div class="card-header bg-success text-white">
<h4 class="mb-0">
Edit Trek
</h4>
</div>


<div class="card-body">


<form method="POST">


<div class="mb-3">

<label class="form-label fw-semibold">
Trek Name
</label>

<input
type="text"
name="name"
class="form-control"
value="{{ trek.name }}"
required>

</div>



<div class="mb-3">

<label class="form-label fw-semibold">
Location
</label>

<input
type="text"
name="location"
class="form-control"
value="{{ trek.location }}"
required>

</div>



<div class="mb-3">

<label class="form-label fw-semibold">
Difficulty
</label>


<select
name="difficulty"
class="form-select"
required>


<option value="Easy"
{% if trek.difficulty=="Easy" %}selected{% endif %}>
Easy
</option>


<option value="Moderate"
{% if trek.difficulty=="Moderate" %}selected{% endif %}>
Moderate
</option>


<option value="Hard"
{% if trek.difficulty=="Hard" %}selected{% endif %}>
Hard
</option>


</select>

</div>



<div class="mb-3">

<label class="form-label fw-semibold">
Trek Date
</label>


<input
type="date"
name="date"
class="form-control"
value="{{ trek.date }}"
required>

</div>




<div class="mb-4">

<label class="form-label fw-semibold">
Available Slots
</label>


<input
type="number"
name="slots"
min="1"
class="form-control"
value="{{ trek.slots }}"
required>

</div>




<div class="d-flex justify-content-between">


<a href="{{ url_for('dashboard.manage_treks') }}"
class="btn btn-outline-secondary">

Cancel

</a>


<button
type="submit"
class="btn btn-success">

Update Trek

</button>


</div>


</form>


</div>


</div>


</div>

</div>

</div>


{% endblock %}
